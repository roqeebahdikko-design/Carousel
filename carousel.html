<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>carouselImages</title>
  <style>
    body {
  font-family: Arial;
  text-align: center;
  margin-top: 30px;
}

.carousel {
  width: 400px;
  height: 300px;
  margin: 30px auto;
  position: relative;
  border: 3px solid #444;
  border-radius: 10px;
  overflow: hidden;
}

.carousel img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.btn-prev, .btn-next, .btn-del{
  position: absolute; 
  bottom: 0; 
  width: 45px;
  height: 45px;
  font-size: 30px;
  border: none;
  background: rgba(0,0,0,0.4);
  color: white;
  cursor: pointer;
}
.btn-prev {
  left: 0;
}

.btn-next {
  right: 0;
}

.btn-del {
  left: 50%;
  transform: translateX(-50%);
}

  </style>
</head>
<body>
  <h2>Upload Your Pictures</h2>
  
<input type="file" multiple accept="image/*" onchange="loadImages(event)">

<div class="carousel">
  <button onclick="prevImage()" class="btn-prev"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"/></svg></button>

  <img id="carouselImage" src="" alt="No Image" />

  <button onclick="nextImage()" class="btn-next"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z"/></svg></button>
  <button onclick="deleteImage()" class="btn-del"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg></button>
</div>
</body>
</html>
<script>

let imagesJSON = [];      
let currentIndex = 0;


window.onload = function() {
    let saved = localStorage.getItem("carouselImages");

    if (saved) {
        imagesJSON = JSON.parse(saved);

        if (imagesJSON.length > 0) {
            currentIndex = 0;
            displayImage();
        }
    }
};
function loadImages(event) {
    let files = event.target.files;

    for (let file of files) {
        let reader = new FileReader();

        reader.onload = function () {
            imagesJSON.push({
                name: file.name,
                src: reader.result
            });

            
            localStorage.setItem("carouselImages", JSON.stringify(imagesJSON));

            
            if (imagesJSON.length === 1) {
                currentIndex = 0;
                displayImage();
            }
        };

        reader.readAsDataURL(file);
    }
}

function displayImage() {
    if (imagesJSON.length === 0) {
        document.getElementById("carouselImage").src = "";
        return;
    }

    document.getElementById("carouselImage").src = imagesJSON[currentIndex].src;
}

function nextImage() {
  
    currentIndex = (currentIndex + 1) % imagesJSON.length;
    displayImage();
}

function prevImage() {

    currentIndex = (currentIndex - 1 + imagesJSON.length) % imagesJSON.length;
    displayImage();
}

function deleteImage() {

   let confirmDelete = confirm("Are you sure you want to delete this picture?");

    if (!confirmDelete) {
        return; 
    }

  imagesJSON.splice(currentIndex, 1)
  localStorage.setItem("carouselImages", JSON.stringify(imagesJSON));
  
  if (currentIndex >= imagesJSON.length) {
        currentIndex = imagesJSON.length - 1; 
    }

   
    if (imagesJSON.length === 0) {
        document.getElementById("carouselImage").src = "";
        return;
    }

   
    displayImage();
}
  


</script>
